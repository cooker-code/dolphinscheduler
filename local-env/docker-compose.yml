# DolphinScheduler 本地开发依赖：PostgreSQL + ZooKeeper
# 项目代码在本地 IDEA / mvn 启动，本文件只起依赖容器。
#
# 用法：
#   ./start.sh docker    # 起容器
#   ./stop.sh  docker    # 停容器（保留数据卷）

# 固定 project 名，避免目录改名时容器/卷被孤立
# 沿用旧 project 名 "dolphinscheduler"（之前 docker-compose-dev.yml 隐式使用），
# 这样容器名/网络/卷都能对齐到现有资源，不会重建。
name: dolphinscheduler

services:
  dolphinscheduler-postgresql:
    image: postgres:14-alpine
    container_name: dolphinscheduler-postgresql
    hostname: dolphinscheduler-postgresql
    ports:
      - "5433:5432"   # 宿主机 5433 -> 容器 5432，避开本机 PG 默认端口
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: dolphinscheduler
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      # 首次启动时自动执行（库为空时才会跑）
      - ../dolphinscheduler-dao/src/main/resources/sql/dolphinscheduler_postgresql.sql:/docker-entrypoint-initdb.d/dolphinscheduler_postgresql.sql
      - dolphinscheduler-postgresql-data:/var/lib/postgresql/data
    networks:
      - dolphinscheduler-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dolphinscheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dolphinscheduler-zookeeper:
    image: zookeeper:3.8
    container_name: dolphinscheduler-zookeeper
    hostname: dolphinscheduler-zookeeper
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,wchs,cons
    volumes:
      - dolphinscheduler-zookeeper-data:/data
      - dolphinscheduler-zookeeper-datalog:/datalog
    networks:
      - dolphinscheduler-dev
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  dolphinscheduler-dev:
    driver: bridge
    name: dolphinscheduler-dev

volumes:
  dolphinscheduler-postgresql-data:
    driver: local
    # 与旧 project（默认目录名前缀）创建的卷对齐，复用现有数据
    name: dolphinscheduler_dolphinscheduler-postgresql-data
  dolphinscheduler-zookeeper-data:
    driver: local
    name: dolphinscheduler_dolphinscheduler-zookeeper-data
  dolphinscheduler-zookeeper-datalog:
    driver: local
    name: dolphinscheduler_dolphinscheduler-zookeeper-datalog
