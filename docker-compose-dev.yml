  #     - ./dolphinscheduler-dao/src/main/resources/sql/dolphinscheduler_mysql.sql:/docker-entrypoint-initdb.d/dolphinscheduler_mysql.sql
  #     - dolphinscheduler-mysql-data:/var/lib/mysql
  #   command: --default-authentication-plugin=mysql_native_password
