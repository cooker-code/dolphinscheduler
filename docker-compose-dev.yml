  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # 可选：Etcd（如果您想用Etcd作为注册中心）
  # dolphinscheduler-etcd:
  #   image: quay.io/coreos/etcd:v3.5.9
  #   container_name: dolphinscheduler-etcd
  #   hostname: dolphinscheduler-etcd
  #   ports:
  #     - "2379:2379"
  #   environment:
  #     - ETCD_NAME=etcd0
  #     - ETCD_DATA_DIR=/etcd-data
  #     - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
  #     - ETCD_ADVERTISE_CLIENT_URLS=http://localhost:2379
  #   volumes:
  #     - dolphinscheduler-etcd-data:/etcd-data
