networks:
  dolphinscheduler-dev:
    driver: bridge
    name: dolphinscheduler-dev

volumes:
  dolphinscheduler-postgresql-data:
    driver: local
  dolphinscheduler-zookeeper-data:
    driver: local
  dolphinscheduler-zookeeper-datalog:
    driver: local
